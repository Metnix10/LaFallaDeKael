<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Falla de Kael</title>
    <link rel="stylesheet" href="estilo.css">

    <script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>
    
</head>
<body>
    <div id="game-container">
        <canvas id="webgl-canvas"></canvas>

        <!-- Interfaz de usuario  -->
        <div id="ui">
            
            <!-- MENÚ PRINCIPAL -->
            <div id="main-menu" class="ui-pantalla">
                <h1 class="titulo">
                    <img src="assets/logo.png" alt="La Falla de Kael" class="logo-img">
                </h1>
                <div class="menu-botones">
                    <button id="btn-jugar" class="btn-capsula">JUGAR</button>
                    <button id="btn-puntuaciones" class="btn-capsula">PUNTUACIONES</button>
                    <button id="btn-config" class="btn-capsula">CONFIGURACIONES</button>
                </div>
            </div>

            <!-- HUD  -->
            <div id="hud" class="ui-hud hidden">
                <div id="hud-nivel">NIVEL: 1/3 · LA CRIPTA</div>
                <div id="hud-puntuacion">PUNTUACIÓN: <span id="puntuacion">0000</span></div>
                <div id="hud-controles">MOVER: W A S D / FLECHAS · ESC: PAUSA</div>
                <div id="hud-tiempo">TIEMPO: <span id="tiempo">02:00</span></div>
                <div id="hud-nucleos">NÚCLEOS: <span id="nucleos">0/3</span></div>
            </div>

            <!-- PANTALLA DE CONFIGURACIONES -->
            <div id="config-pantalla" class="ui-pantalla vent hidden">
                <div class="pantalla-cont">
                    <h2>CONFIGURACIONES</h2>
                    <div class="field-group">
                        <label for="slider-volume">VOLUMEN</label>
                        <div class="slider-box">
                            <input type="range" id="slider-volume" min="0" max="100" value="50">
                        </div>
                    </div>
                    <div class="field-group">
                        <label>CALIDAD GRÁFICA</label>
                        <div class="btn-graficos">
                            <button type="button" id="btn-baja" class="btn-opcion" data-quality="baja">BAJA</button>
                            <button type="button" id="btn-media" class="btn-opcion activo" data-quality="media">MEDIA</button>
                            <button type="button" id="btn-alta" class="btn-opcion" data-quality="alta">ALTA</button>
                        </div>
                    </div>
                    <div class="btn-menu">
                        <button type="button" id="btn-guardar" class="btn-capsula sm">GUARDAR</button>
                        <button type="button" id="btn-volver-config" class="btn-capsula sm">VOLVER</button>
                    </div>
                </div>
            </div>

            <!-- PANTALLA DE PUNTUACIONES -->
            <div id="puntuaciones-pantalla" class="ui-pantalla vent hidden">
                <div class="pantalla-cont">
                    <h2>PUNTUACIONES</h2>
                    <table id="puntos-tabla">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>JUGADOR</th>
                                <th>PUNTAJE</th>
                            </tr>
                        </thead>
                        <tbody id="puntos-body">
                            <tr><td>1</td><td>PLAYER01</td><td>9850</td></tr>
                            <tr><td>2</td><td>PLAYER01</td><td>9850</td></tr>
                            <tr><td>3</td><td>PLAYER01</td><td>9850</td></tr>
                            <tr><td>4</td><td>PLAYER01</td><td>9850</td></tr>
                            <tr><td>5</td><td>PLAYER01</td><td>9850</td></tr>
                        </tbody>
                    </table>
                    <button type="button" id="btn-volver-puntos" class="btn-capsula sm">VOLVER</button>
                </div>
            </div>

            <!-- PANTALLA DE PAUSA -->
            <div id="pausa-pantalla" class="ui-pantalla vent hidden">
                <div class="pantalla-cont">
                    <h2>PAUSA</h2>
                    <div class="menu-botones">
                        <button type="button" id="btn-reanudar" class="btn-capsula">REANUDAR</button>
                        <button type="button" id="btn-salir" class="btn-capsula">MENÚ</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="js/ui.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
