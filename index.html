<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Falla de Kael</title>
    <link rel="stylesheet" href="estilo.css">

    <script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>
</head>
<body>
    <div id="game-container">
        <canvas id="webgl-canvas"></canvas>

        <!-- Interfaz de usuario  -->
        <div id="ui">

            <!-- MENÚ PRINCIPAL -->
            <div id="main-menu" class="ui-pantalla">
                <h1 class="titulo">
                    <img src="assets/logo.png" alt="La Falla de Kael" class="logo-img">
                </h1>
                <div class="menu-botones">
                    <button id="btn-jugar" class="btn-capsula">JUGAR</button>
                    <button id="btn-puntuaciones" class="btn-capsula">PUNTUACIONES</button>
                    <button id="btn-config" class="btn-capsula">CONFIGURACIONES</button>
                </div>
            </div>

            <!-- SELECCIÓN DE MODO Y DIFICULTAD -->
            <div id="modo-pantalla" class="ui-pantalla vent hidden">
                <div class="pantalla-cont">
                    <h2>NUEVA PARTIDA</h2>
                    <div class="field-group">
                        <label for="input-nombre">NOMBRE</label>
                        <input type="text" id="input-nombre" class="texto-input" maxlength="12" placeholder="JUGADOR">
                    </div>
                    <div class="field-group">
                        <label>MODO DE JUEGO</label>
                        <div class="btn-graficos">
                            <button type="button" class="btn-opcion activo" data-modo="aventura">AVENTURA</button>
                            <button type="button" class="btn-opcion" data-modo="supervivencia">SUPERVIVENCIA</button>
                        </div>
                    </div>
                    <div class="field-group">
                        <label>DIFICULTAD</label>
                        <div class="btn-graficos">
                            <button type="button" class="btn-opcion activo" data-dificultad="facil">FÁCIL</button>
                            <button type="button" class="btn-opcion" data-dificultad="dificil">DIFÍCIL</button>
                        </div>
                    </div>
                    <p id="modo-desc" class="modo-desc"></p>
                    <div class="btn-menu">
                        <button type="button" id="btn-comenzar" class="btn-capsula sm">COMENZAR</button>
                        <button type="button" id="btn-volver-modo" class="btn-capsula sm">VOLVER</button>
                    </div>
                </div>
            </div>

            <!-- HUD  -->
            <div id="hud" class="ui-hud hidden">
                <div id="hud-nivel">NIVEL: 1/3 · LA CRIPTA</div>
                <div id="hud-puntuacion">PUNTUACIÓN: <span id="puntuacion">0000</span></div>
                <div id="hud-vidas">VIDAS: <span id="vidas">♥♥♥</span></div>
                <div id="hud-controles">MOVER: W A S D / FLECHAS · ESC: PAUSA</div>
                <div id="hud-tiempo">TIEMPO: <span id="tiempo">02:00</span></div>
                <div id="hud-nucleos">NÚCLEOS: <span id="nucleos">0/3</span></div>
            </div>

            <!-- MENÚ DE PAUSA -->
            <div id="pausa-pantalla" class="ui-pantalla fondo-juego hidden">
                <div class="pantalla-cont">
                    <h2>PAUSA</h2>
                    <div class="btn-menu">
                        <button type="button" id="btn-reanudar" class="btn-capsula sm">REANUDAR</button>
                        <button type="button" id="btn-salir-pausa" class="btn-capsula sm">SALIR</button>
                    </div>
                </div>
            </div>

            <!-- PANTALLA DE CONFIGURACIONES -->
            <div id="config-pantalla" class="ui-pantalla vent hidden">
                <div class="pantalla-cont">
                    <h2>CONFIGURACIONES</h2>
                    <div class="field-group">
                        <label for="slider-volume">VOLUMEN</label>
                        <div class="slider-box">
                            <input type="range" id="slider-volume" min="0" max="100" value="50">
                        </div>
                    </div>
                    <div class="field-group">
                        <label>CALIDAD GRÁFICA</label>
                        <div class="btn-graficos">
                            <button type="button" id="btn-baja" class="btn-opcion" data-quality="baja">BAJA</button>
                            <button type="button" id="btn-media" class="btn-opcion activo" data-quality="media">MEDIA</button>
                            <button type="button" id="btn-alta" class="btn-opcion" data-quality="alta">ALTA</button>
                        </div>
                    </div>
                    <div class="btn-menu">
                        <button type="button" id="btn-guardar" class="btn-capsula sm">GUARDAR</button>
                        <button type="button" id="btn-volver-config" class="btn-capsula sm">VOLVER</button>
                    </div>
                </div>
            </div>

            <!-- PANTALLA DE PUNTUACIONES -->
            <div id="puntuaciones-pantalla" class="ui-pantalla vent hidden">
                <div class="pantalla-cont">
                    <h2>PUNTUACIONES</h2>
                    <table id="puntos-tabla">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>JUGADOR</th>
                                <th>PUNTAJE</th>
                                <th>MODO</th>
                            </tr>
                        </thead>
                        <tbody id="puntos-body"></tbody>
                    </table>
                    <p id="puntos-origen" class="nota"></p>
                    <button type="button" id="btn-volver-puntos" class="btn-capsula sm">VOLVER</button>
                </div>
            </div>

            <!-- PANTALLA DE FIN DE PARTIDA -->
            <div id="fin-pantalla" class="ui-pantalla fondo-juego hidden">
                <div class="pantalla-cont">
                    <h2 id="fin-titulo">GAME OVER</h2>
                    <p id="fin-motivo" class="nota"></p>
                    <div id="fin-puntos" class="fin-puntos">0</div>
                    <p id="fin-guardado" class="nota"></p>
                    <div class="btn-menu">
                        <button type="button" id="btn-compartir-fb" class="btn-capsula sm btn-fb">FACEBOOK</button>
                        <button type="button" id="btn-compartir-x" class="btn-capsula sm btn-x">X</button>
                    </div>
                    <div class="btn-menu">
                        <button type="button" id="btn-reintentar" class="btn-capsula sm">REINTENTAR</button>
                        <button type="button" id="btn-fin-menu" class="btn-capsula sm">MENÚ</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="js/ui.js"></script>
</body>
</html>
